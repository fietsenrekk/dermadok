name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Graded image variants are committed, so ffmpeg is not needed here —
      # tools/images.mjs only runs locally when source photography changes.
      - name: Build
        run: node tools/build.mjs
        env:
          BASE_PATH: /dermadok

      # The audit is a gate, not a report. Dead links, missing alt text,
      # heading jumps or off-domain assets fail the deploy.
      - name: Audit
        run: node tools/audit.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
